<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <link rel="apple-touch-icon" href="/gt7icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>GT7 Motor</title>

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme-dark');
          // ถ้าเพิ่งเข้าเว็บครั้งแรก (null) หรือเคยบันทึกไว้ว่า '1' ให้ใส่คลาส dark-theme ทันที
          if (savedTheme === null || savedTheme === '1') {
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {
          // ป้องกัน error กรณีเบราว์เซอร์บล็อก localStorage
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
